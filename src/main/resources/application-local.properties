# Run without PostgreSQL/Docker: mvn spring-boot:run "-Dspring-boot.run.profiles=local"
# Data lives in memory and is re-seeded by Flyway on every start.
spring.datasource.url=jdbc:h2:mem:doorstep;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=20000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
