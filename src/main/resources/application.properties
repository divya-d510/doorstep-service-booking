spring.application.name=doorstep-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/doorstep}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:doorstep}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:doorstep}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.jackson.time-zone=Asia/Kolkata
spring.jackson.deserialization.fail-on-unknown-properties=false

management.endpoints.web.exposure.include=health
springdoc.show-actuator=true
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n
