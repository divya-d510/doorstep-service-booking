services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: doorstep
      POSTGRES_USER: doorstep
      POSTGRES_PASSWORD: doorstep
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doorstep -d doorstep"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/doorstep
      SPRING_DATASOURCE_USERNAME: doorstep
      SPRING_DATASOURCE_PASSWORD: doorstep
    ports:
      - "8080:8080"
